# ==============================================================================
# Ubuntu 24.04 / Linux Production Override — NVIDIA GPU Acceleration
# ==============================================================================
# Use this file on the target Ubuntu machine to enable GPU acceleration for
# ONNX face recognition models (ArcFace, YuNet, SFace).
#
# NOTE: No webcam device passthrough is needed anymore.
#       The browser opens the webcam via getUserMedia() on the client side.
#
# USAGE:
#   docker compose -f docker-compose.yml -f docker-compose.linux.yml up -d
#
# PREREQUISITES:
#   sudo apt-get install -y nvidia-container-toolkit
#   sudo systemctl restart docker
# ==============================================================================

services:
  cctv-monitor:
    # --- NVIDIA GPU Acceleration ---
    # Enables CUDAExecutionProvider for ONNX Runtime (ArcFace, YuNet, SFace)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # Pass CUDA visible devices environment variable
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
